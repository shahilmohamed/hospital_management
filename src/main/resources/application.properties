spring.application.name=hospitalReport

# Server port - Railway sets PORT environment variable
server.port=${PORT ? PORT : 8080}

spring.datasource.url=${MYSQL_PUBLIC_URL?MYSQL_PUBLIC_URL:jdbc:mysql://localhost:3306/hospital}
spring.datasource.username=${MYSQLUSER?MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD?MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO ? HIBERNATE_DDL_AUTO : update}
spring.jpa.show-sql=${SHOW_SQL ? SHOW_SQL : true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret - should be set as environment variable in Railway (generate a secure random string)
jwt.secret=${JWT_SECRET ? JWT_SECRET : 9ae48cf8c8f646daac2f8992ab2710ef1234567890abcdef1234567890abcd}

# CORS configuration - set allowed origins for your frontend (comma-separated for multiple origins)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS ? CORS_ALLOWED_ORIGINS : http://localhost:4200,https://shahil-hospital-management.netlify.app,https://subha-hospital.netlify.app}

# MongoDB - set MONGODB_URI for Atlas; defaults to local MongoDB
spring.data.mongodb.uri=${MONGO_URL ?MONGO_URL :mongodb://localhost:27017/hospital}
#spring.data.mongodb.uri=mongodb://shahilmmohamed_db_user:root@ac-9kbqpye-shard-00-00.3lfrrlb.mongodb.net:27017,ac-9kbqpye-shard-00-01.3lfrrlb.mongodb.net:27017,ac-9kbqpye-shard-00-02.3lfrrlb.mongodb.net:27017/hospital?ssl=true&replicaSet=atlas-o1fmvz-shard-0&authSource=admin&appName=hospital

# MongoDB query logging (similar to spring.jpa.show-sql)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.repository.query=DEBUG

# Drug log sync to MongoDB - daily at 10:00 PM
drug.log.sync.cron=0 0 22 * * *
drug.log.sync.time-zone=Asia/Kolkata